version: "2"
run:
  timeout: 5m
  tests: true
  issues-exit-code: 1
output:
  formats:
    text:
      path: stdout
      print-issued-lines: false
      print-linter-name: true
      colors: false
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: none
  enable:
    - errcheck
    - depguard
    - govet
    - staticcheck
    - revive
    - errorlint
    - gocritic
    - nakedret
    - nolintlint
    - usestdlibvars
    - copyloopvar
    - nonamedreturns
    - forbidigo
    - funlen
    - gocognit
    - nestif
    - errname
    - interfacebloat
    - dupl
    - asciicheck
    - bidichk
    - unused
    - bodyclose
    - noctx
    - gosec
    - modernize
    - perfsprint
    - gochecksumtype
  settings:
    # A type switch over a sealed sum (an interface marked //sumtype:decl)
    # must list every case. A default branch does not count as listing them.
    gochecksumtype:
      default-signifies-exhaustive: false
    # The Kafka oracle (internal/verify/simulator/kafka) must stay independent of
    # the specs it is tested against (decision 21). Only its own tests (the C4
    # check) may import a spec.
    depguard:
      rules:
        kafka-oracle-no-spec:
          list-mode: lax
          files:
            - "**/internal/verify/simulator/kafka/**"
            - "!$test"
          deny:
            - pkg: "github.com/manifesterio/mds/broker/spec"
              desc: "the Kafka oracle must not import the broker spec (decision 21)"
            - pkg: "github.com/manifesterio/mds/controlplane/spec"
              desc: "the Kafka oracle must not import the control plane spec (decision 21)"
            - pkg: "github.com/manifesterio/mds/broker/internal/verify/speccheck"
              desc: "the Kafka oracle must not import speccheck, the checker or the spec bridge (decision 21)"
        dst-layers:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/verify/**"
            - "!**/cmd/*sim*/**"
          deny:
            - pkg: "github.com/manifesterio/mds/dst/sim"
              desc: "production code may import dst/actor, dst/trace and dst/live only; sim, campaign and spectest are for tests and simulators (plan section 6)"
            - pkg: "github.com/manifesterio/mds/dst/campaign"
              desc: "production code may import dst/actor, dst/trace and dst/live only; sim, campaign and spectest are for tests and simulators (plan section 6)"
            - pkg: "github.com/manifesterio/mds/dst/spectest"
              desc: "production code may import dst/actor, dst/trace and dst/live only; sim, campaign and spectest are for tests and simulators (plan section 6)"
    gosec:
      excludes:
        - G115
    nonamedreturns:
      report-error-in-defer: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "return an error; panic is for impossible state in internal/core and internal/verify/simulator only (Effective Go, Panic)"
        # The actor runtime seam is for dst/sim and dst/live.
        # Product code builds actors; only runtimes (and tests/verify) open effects.
        - pattern: ^actor\.(Effect([A-Z][A-Za-z]*)?|Binding|NewOutbox|Close|NewEntityRef|NewReplyTo|NewServiceRef|As|NewOwner|Asker|ReplyID|EntityID|ServiceID)$
          pkg: ^github\.com/manifesterio/mds/dst/actor$
          msg: "actor runtime seam is for dst/sim and dst/live only"
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25
    nestif:
      min-complexity: 5
    interfacebloat:
      max: 8
    dupl:
      threshold: 50
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: receiver-naming
        - name: unexported-return
        - name: context-as-argument
        - name: use-any
        - name: early-return
    nolintlint:
      require-specific: true
      require-explanation: true
  exclusions:
    generated: lax
    paths:
      - testdata
      - build
    rules:
      - linters: [forbidigo]
        text: 'panic'
        path: '^(internal/core|internal/verify/simulator|ops/tools|internal/verify/speccheck)/|_test\.go$'
      - linters: [forbidigo]
        text: 'actor runtime seam'
        path: '_test\.go$|internal/verify/'
      - linters: [funlen, gocognit, nestif, dupl, interfacebloat]
        path: '_test\.go$'
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - testdata
